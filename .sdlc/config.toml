# The config format this file follows.
config_version = 1
# Past this many follow-ups, a batch recommends instead of filing, so the backlog doesn't grow unattended.
autonomous_new_task_limit = 5
# Task branches are <prefix><number>-<slug>. The project slug makes them easy to spot.
branch_prefix = "sdlc-"
# Pause with room left in the context window to write the pause report.
context_usage_halt_pct = 85
# Three rejections on one task means the human should decide, not the loop.
critic_rejection_attempts = 3
# The branch batches merge into.
default_branch = "main"
# Paths review-docs skips.
docs_ignore_paths = []
# The repo docs review-docs checks.
docs_review_paths = ["CLAUDE.md", "README.md"]
# The repo docs a task updates when its change affects them.
docs_update_paths = ["README.md"]
# Run by the quality gate. Empty means not configured.
format_command = ".venv/bin/ruff format --check ."
# A denial repeated twice is a rule the task can't work around, so ask the human.
guardrail_denial_attempts = 2
# Paths the clean-tree check ignores, such as scratch files.
ignored_paths = []
# Run by the quality gate. Empty means not configured.
lint_command = ".venv/bin/ruff check ."
# Three failed gate runs on one task means the fix needs the human.
quality_gate_attempts = 3
# The remote batches pull from and push to.
remote = "origin"
# About a month of working days with commits, after which refine-backlog asks about a task.
stale_active_days = 20
# Run by the quality gate. Empty means not configured.
test_command = ".venv/bin/python -m pytest"
# Under .sdlc/local/, which is gitignored, so throwaway tests are never committed.
throwaway_test_dir = ".sdlc/local/throwaway-tests"
# Stops a runaway batch before it costs too much. Tune it after a few batches.
token_budget_per_batch = 5000000

[critic]
# Nothing goes to a third-party critic until you opt in.
external_opt_in = false
# A larger diff halts instead of being truncated. 200 KB covers a normal task.
max_diff_bytes = 200000
# Stop before the provider balance runs out mid-review.
min_balance = 1.0
# The read-only reviewer subagent's model.
model = "haiku"
# A Claude Code subagent. An external provider is opt-in.
provider = "subagent"

[docs]
backend = "outline"

[evals]
# One run, no baseline, a pinned model, and a local-only report: the per-task gate. {tag} is the skill whose cases run.
command = "claude plugin eval . --tag {tag} --runs 1 --ablation none --model claude-sonnet-5-5 --no-publish --scaffold"
# Run the changed skills' evals after each task. "batch" runs them once at the end.
gate = "task"

