[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-llm"
version = "2.0.0.dev0"
description = "Claude Code plugin for a solo, LLM-driven SDLC on Kaneo and Outline."
requires-python = ">=3.11"
dependencies = []

# pytest is the one dev dependency. The plugin's scripts use only the standard library.
[project.optional-dependencies]
dev = ["pytest"]

# The scripts are loaded by path, not installed as a package.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
