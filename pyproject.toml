[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-llm"
version = "2.0.0.dev0"
description = "Claude Code plugin for a solo, LLM-driven SDLC on Kaneo and Outline."
requires-python = ">=3.11"
dependencies = []

# The dev dependencies are the test runner and the linter. The plugin's scripts use only the standard library.
[project.optional-dependencies]
dev = ["pytest", "ruff"]

# The scripts are loaded by path, not installed as a package.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

# Set here so the result is the same on every machine, whatever ruff's own defaults are.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE", "C4", "E", "F", "I", "PLW", "RUF", "UP", "W"]
# Notification text says "3×" for a repeat count.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Scripts run by path put the plugin root on sys.path before importing from lib.
"hooks/stop_notify.py" = ["E402"]
"lib/notify.py" = ["E402"]
"skills/setup-project/scripts/setup.py" = ["E402"]
